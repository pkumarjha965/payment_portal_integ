# HTTP Configuration
quarkus.http.port=8080

# CORS Configuration
quarkus.http.cors.enabled=true

# Allow React frontend
quarkus.http.cors.origins=http://localhost:5173

# Allowed HTTP methods
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Allowed headers
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Allow credentials (cookies/auth headers, if needed)
quarkus.http.cors.access-control-allow-credentials=true

# Preflight cache duration
quarkus.http.cors.access-control-max-age=24H

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:${STRIP_SECRET_KEY:}}

# FedEx Configuration
fedex.client-id=${FEDEX_CLIENT_ID:${FEDEX_API_KEY:}}
fedex.client-secret=${FEDEX_CLIENT_SECRET:${FEDX_API_SECRET:${FEDEX_API_SECRET:}}}
fedex.base-url=${FEDEX_BASE_URL:https://apis-sandbox.fedex.com}
fedex.token-endpoint=${FEDEX_TOKEN_ENDPOINT:/oauth/token}
fedex.timeout-seconds=${FEDEX_TIMEOUT_SECONDS:15}
fedex.expiry-buffer-seconds=${FEDEX_EXPIRY_BUFFER_SECONDS:120}

# Legacy alias
fedx.api-key=${FEDEX_API_KEY:}

app.frontend.url=http://localhost:5173

# Database connection
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/payment_portal

# JDBC driver
quarkus.datasource.jdbc.driver=org.postgresql.Driver

# Flyway configuration
quarkus.flyway.migrate-at-start=false
quarkus.flyway.baseline-on-migrate=true
